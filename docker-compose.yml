services:

  geoipupdate:
    image: maxmindinc/geoipupdate
    env_file:
      - ./src/.env
    environment:
      - GEOIPUPDATE_ACCOUNT_ID
      - GEOIPUPDATE_LICENSE_KEY
      - GEOIPUPDATE_EDITION_IDS
      - GEOIPUPDATE_FREQUENCY
    volumes:
      - /opt/geoip:/usr/share/GeoIP

  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    ports:
      - "2222:2222"
    volumes:
      # Config (volume named esistente — non toccare)
      - cowrie_etc:/cowrie/cowrie-git/etc
      # Stato interno (volume named esistente — non toccare)
      - cowrie_var:/cowrie/cowrie-git/var
      # Log JSON condivisi con l'app — sovrascrive la sottocartella del volume named
      # Cowrie scrive in var/log/cowrie (relativo a cowrie-git/) → /cowrie/cowrie-git/var/log/cowrie
      - /home/orion/cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: sensor_data
      TZ: Europe/Rome
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - smarthouse-net

  mongodb:
    image: mongo:4.4.18
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db
    networks:
      - smarthouse-net

  main:
    build:
      context: ./src
      dockerfile: Dockerfile
    command: python3 main.py
    privileged: true
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_DATABASE=sensor_data
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - TZ=Europe/Rome
    restart: unless-stopped
    networks:
      - smarthouse-net

  app:
    build:
      context: ./src
      dockerfile: Dockerfile
    command: python3 app.py
    depends_on:
      - db
      - main
      - mongodb
      - redis
    environment:
      - MONGO_URI=mongodb://root:example@localhost:27017/
      - DB_HOST=localhost
      - DB_DATABASE=sensor_data
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - TZ=Europe/Rome
      - UPLOAD_FOLDER=/app/uploads
      - TESSERACT_CMD=/usr/bin/tesseract
      - NETWORK_SUBNET=192.168.178.0/24
      - FRITZ_IP=192.168.178.1
      - GEOIP_DB_PATH=/usr/share/GeoIP/GeoLite2-City.mmdb
      - RASPI_HOST_IP=127.0.0.1
      - RASPI_HOST_USER=orion
      - RASPI_HOST_KEY_PATH=/run/secrets/id_rsa
      - COWRIE_LOG_PATH=/var/log/cowrie/cowrie.json
    volumes:
      - ./backup:/backup
      - ./src/static:/app/static
      - ./uploads:/app/uploads
      - ./uploads/GeoLite2-City.mmdb:/usr/share/GeoIP/GeoLite2-City.mmdb:ro
      - ./src/credentials/gcredentials.json:/app/gcredentials.json:ro
      - ./src/credentials/gcredentials_new.json:/app/gcredentials_new.json:ro
      # Stessa cartella host che Cowrie usa per scrivere i log
      - /home/orion/cowrie-logs:/var/log/cowrie:ro
      - /var/lib/fail2ban/fail2ban.sqlite3:/var/lib/fail2ban/fail2ban.sqlite3:ro
      - /home/orion/.ssh/id_rsa_dashboard:/run/secrets/id_rsa:ro
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    env_file:
      - ./src/.env

  network_scanner:
    build:
      context: ./src
      dockerfile: Dockerfile.scanner
    privileged: true
    network_mode: host
    command: python3 scanner_service.py
    environment:
      - NETWORK_SUBNET=192.168.178.0/24
      - DB_HOST=192.168.178.101
      - REDIS_HOST=127.0.0.1
    depends_on:
      - redis
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8081:80"
      - "4443:443"
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/smarthouse-ecc.crt:/etc/nginx/certs/smarthouse-ecc.crt:ro
      - ./nginx/smarthouse-ecc.key:/etc/nginx/certs/smarthouse-ecc.key:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - smarthouse-net

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - smarthouse-net

volumes:
  postgres_data:
  mongo-data:
  # Volumi named esistenti di Cowrie — Docker li riutilizzerà automaticamente
  # tramite i loro ID completi. Se vuoi usare nomi leggibili, vedi nota sotto.
  cowrie_etc:
    external: true
    name: cf40368c7793532af755632bc8a767fda6d334d0a305c4fa188ccf9d46687c7a
  cowrie_var:
    external: true
    name: d14a9c5a74dff5a247bc5d8abdf099bf22a1ca4d4d9bd992303d98d85cfc4a0e

networks:
  smarthouse-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-smarthouse
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1